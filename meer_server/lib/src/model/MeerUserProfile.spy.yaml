class: MeerUserProfile
table: user
fields:
  # ربط المستخدم بحساب المصادقة في Serverpod
  authUser: module:serverpod_auth_core:AuthUser?, relation(optional, onDelete=Cascade)

  # بيانات المستخدم
  fullName: String
  phone: String
  email: String?
  role: String
  isSeller: bool, default=false

  # بيانات المستخدم الشخصية
  address: String?
  latitude: double?
  longitude: double?

  # بيانات المتجر
  storeName: String?
  storeDescription: String?
  storeAddress: String?
  storeCity: MeerCity?
  storeDistrict: String?
  storeLatitude: double?
  storeLongitude: double?

  createdAt: DateTime

indexes:
  user_auth_user_id_idx:
    fields: authUserId
    unique: true