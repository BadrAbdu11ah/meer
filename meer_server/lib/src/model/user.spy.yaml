class: User
table: user
fields:
  ### ربط المستخدم بحساب المصادقة في Serverpod
  authUser: module:serverpod_auth_core:AuthUser?, relation(optional, onDelete=Cascade)
  fullName: String
  phone: String
  email: String? # يفضل حفظ إيميل جوجل هنا بدلاً من حقل الهاتف
  role: String # customer, seller, driver
  address: String?
  latitude: double?
  longitude: double?
  createdAt: DateTime

indexes:
  user_auth_user_id_idx:
    fields: authUserId
    unique: true