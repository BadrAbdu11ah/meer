name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.4'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      # The test config uses an embedded PostgreSQL instance.
      # Cache its binaries between workflow runs.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{ runner.os }}-${{ env.VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: meer_server
        run: serverpod generate

      - name: Run tests
        working-directory: meer_server
        env:
          SERVERPOD_PASSWORD_database: ${{ secrets.SERVERPOD_PASSWORD_DATABASE }}
          SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: ${{ secrets.SERVERPOD_PASSWORD_JWT_HMAC_SHA512_PRIVATE_KEY }}
          SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: ${{ secrets.SERVERPOD_PASSWORD_JWT_REFRESH_TOKEN_HASH_PEPPER }}
          SERVERPOD_PASSWORD_otpRateLimitSecret: ${{ secrets.SERVERPOD_PASSWORD_OTP_RATE_LIMIT_SECRET }}
        run: |
          set -euo pipefail

          for name in \
            SERVERPOD_PASSWORD_database \
            SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey \
            SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper \
            SERVERPOD_PASSWORD_otpRateLimitSecret
          do
            value="$(printenv "$name" 2>/dev/null || true)"

            if [[ -z "$value" ]]; then
              echo "::error::Missing required GitHub Actions secret for $name"
              exit 1
            fi
          done

          dart test
          
      - name: Install Flutter app dependencies
        working-directory: meer_flutter
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: meer_flutter
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: meer_flutter
        run: flutter test --no-pub
